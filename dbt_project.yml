name: nyc_analytics
version: 1.0.0
config-version: 2
profile: default
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
target-path: target
clean-targets:
  - target
  - dbt_packages

# Set up models
models:
  nyc_analytics:
    +materialized: 
    
    assignment_work:
      staging:
        +materialized: table
        +schema: nyc_homework_staging

      marts:
        +materialized: table
        +schema: nyc_homework_warehouse_marts

        conformed:
          +materialized: table

        dob_job_filings:
          +materialized: table

        dot_311:
          +materialized: table

    project_work: # setting up model for project
      staging:
        +materialized: table
        +schema: project_staging_data

      marts:
        +materialized: table
        +schema: project_warehouse_marts

        conformed:
          +materialized: table

        restaurant_inspection:
          +materialized: table
          
        dohmh_311:
          +materialized: table